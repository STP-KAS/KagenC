[package]
name = "kagen-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs the AgencKas covenant in the Kaspa script engine from SilverScript v1.0.0"

[dependencies]
blake2b_simd = "1.0.2"
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
serde_json = "1.0"
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", tag = "v1.0.0" }
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", tag = "v1.0.0" }
